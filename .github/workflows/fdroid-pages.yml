name: Publish F-Droid repo to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download repo files from the repo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/repo
          gh release download repo --repo ${{ github.repository }} --dir public/repo --pattern 'index-v1.jar' --pattern 'index-v1.json' --pattern 'index-v2.json' --pattern '*.apk' --clobber
          ls -la public/repo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
